<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrando Texto</title>
</head>

<body>
    <div style="display: block; position: fixed; right: 0px; background-color: red;">
        Debe estar arriba a la derecha
    </div>
    <div style="display: block; position: fixed; top: 50%; left: 30%; background-color: blue;">
        Este va en el centro de la pantalla
    </div>
    <div style="bottom: 0%; left: 35%; position: fixed; background-color: green;">
        Este va abajo en el centro
    </div>

</body>
</html>
