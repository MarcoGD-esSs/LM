<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica Formularios</title>
</head>
<body>
    <h1>Pracica Formulario 1</h1>
    <form action="practica formularios.html" method="post">
        <Fieldset>
            <legend>Completar</legend>
            <label for="color">Eliga un color:</label>
            <input type="color" name="color" id="color">
            <br>
            <textarea name="text" id="text" cols="53" rows="5" placeholder="Por favor, escriba aqui"></textarea>
            <br>
            <select>
                <option value="java">Java </option>
                <option value="python">Python </option>
                <option value="html">HTML</option>
            </select>
            <br>
            <input type="checkbox" name="ciclo" value="cicloasir">ASIR
            <input type="checkbox" name="ciclo" value="ciclodam">DAM
            <input type="checkbox" name="ciclo" value="ciclodaw">DAW
        </Fieldset>
        <fieldset>
         <legend>Rellene las opciones siguientes</legend>
         <label for="fecha">Elija una fecha:</label>  
         <imput type="date" name="fecha" id="fecha">
         <textarea name="fecha" id="fecha" cols="10" rows="1" placeholder="dd/mm/aaaa"></textarea>
         <br>
         <label for="fichero">Elija un fichero:</label>
         <input type="file" name="fichero" id="fichero">
         <br>
         <select size="4">
            <option value="smir">SMIR</option>
            <option value="asir">ASIR</option>
            <option value="dam">DAM</option>
            <option value="daw">DAW</option>
         </select>
        </fieldset>
    </form>
    <hr>
    <h1>Practica Formulario 2</h1>
    <form>
        <fieldset>
            <legend>Rellenar</legend>
            <input type="radio" name="asignatura" value="asignaturalengua "/>Lengua
            <br>
            <input type="radio" name="asignatura" value="asignaturamatematicas"/>Matematicas
            <br>
            <input type="radio" name="asignatura" value="asignaturahistoria"/>Historia
            <br>
            <input type="radio" name="asignatura" value="asignaturagreografia"/>Geografia
            <br>
            <input type="checkbox" name="editor" value="notepad"/>Notepad
            <input type="checkbox" name="editor" value="editoremacs"/>Emacs
            <input type="checkbox" name="editor" value="Otro"/>Otro
            <br>
            <textarea name="procesador" rows="5" cols="59">Escriba aqui, por favor</textarea>
            <br>
            <select name="procesador">
                <option value="amd">AMD</option>
                <option value="intel_i5">Intel i5</option>
                <option value="intel_i7">Intel i7</option>
            </select>
        </fieldset>
    </form>

    <h1>Practica Formulario 3</h1>
    <form>
        <fieldset>
            <legend>Rellenar</legend>
            <input type="radio" name="asignatura" value="asignaturageografia "/>Geografia
            <input type="radio" name="asignatura" value="asignaturalengua"/>Lengua
            <input type="radio" name="asignatura" value="asignaturamatematicas"/>Matematicas
            <input type="radio" name="asignatura" value="asignaturahistoria"/>Historia
            <br>
            <label for="hora">Elija una hora:</label>
            <input type="time" id="hora" name="hora" value="hora"/>
            <br>
            <input type="checkbox" name="idioma" value="idiomaespanol"/>Español
            <br>
            <input type="checkbox" name="idioma" value="idiomaingles"/>Ingles
            <br>
            <input type="checkbox" name="idioma" value="idiomaaleman"/>Aleman
            <br>
            <input type="checkbox" name="idioma" value="idiomaFRANCES"/>Francés
            <br>
            <br>
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre">
            <br>
            <label for="apellido">Apellido:</label>
            <input type="text" name="apellido" id="apellido">

        </fieldset>
</body>
</html>
