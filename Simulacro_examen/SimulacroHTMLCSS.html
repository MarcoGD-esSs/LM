<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulacro Practico</title>
    <style>
        body {
            background-image: url(img/papel.avif);
        }
        p {
            font-size: 16px;
        }

        }
        .tituloazul {

        }

</head>
<body>

        <tr>

                    <tr>
                        <td>A1</td>
                        <td>A2</td>
                        <td>A3</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>
                <table border="1">
                    <tr>
                        <td>B1</td>
                    </tr>
                    <tr>
                        <td>B2</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <h2>Escribe un documento HTML que incluya los siguientes puntos:</h2>

    <h1 class="tituloazul">Este es mi examen</h1>
    <p>Esta es <a href="http://www.vedoque.com/">una buena pagina</a></p>

    <table border="2">

</body>
<footer>
    <p>Hoy si que voy a aprobar</p>
    <div>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
        <br>
        <label for="ciclo">Ciclo:</label>
        <select name="ciclo" id="ciclo">
            <option value="ASIR">ASIR</option>
            <option value="DAM">DAM</option>
            <option value="DAW">DAW</option>
        </select>
        <br>
        <label>Curso:</label>
        <input type="radio" id="primero" name="curso" value="Primero">
        <input type="radio" id="segundo" name="curso" value="Segundo">
        <br>
        <input type="checkbox" id="estudios" name="estudios">

        <input type="submit" value="Enviar">
    </form>
